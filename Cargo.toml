[package]
name = "lrb"
version = "0.3.0"
edition = "2021"
authors = ["LegendaryRustBucket contributors"]
description = "Native Rust Epic Games launcher foundation, optimized for Rocket League"
license = "GPL-3.0-or-later"
repository = "https://github.com/BryonHigbee/legendaryrustbucket"
publish = false

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
dirs = "6.0"
